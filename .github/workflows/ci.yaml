name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # staticcheck 2026.2.1 can't read Go 1.27.2 export data (dominikh/go-tools#1832); move to 1.27 once fixed
          go-version: "1.26"

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Lint (gofmt, go vet, staticcheck)
        run: make lint

      - name: Run govulncheck
        run: make vulncheck

      - name: Run tests
        run: make test
